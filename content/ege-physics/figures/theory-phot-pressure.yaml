# quantum.photons 1.5: a photon with momentum p (accent arrow, 44 px) hits a black surface and
# a mirror head-on. The black surface absorbs it: the photon's momentum goes from p to 0, the
# surface gets p. The mirror sends it back with −p: the change is 2p, and the mirror gets 2p
# (red, twice as long), as the wall in mechanics 10.5 gets 2mv from a bouncing ball.
