# electro.field.conductors 3.3: left, a charged metal sphere — the charge on its surface
# (small «+» just inside it), radial field lines outside, E = 0 inside; right, a point charge
# at the centre of the same (dashed muted) sphere — outside, the same lines.
# Colours (extends «Напряжённость и потенциал электрического поля»): a charge is a circle in
# the text colour with «+» or «−»; electrons small text-colour dots, moved ones accent; forces
# red; field lines text colour, thin, with small arrowheads; E at a point an accent vector.
# A conductor is a surface-filled body with a text-colour outline, its induced charges small
# «+» and «−» in the text colour just inside its surface; a dielectric an accent tint, its
# molecules small ovals (dipoles) with «+» and «−» ends, bound charges small «+» and «−» at
# its surface. A charged rod (a dielectric) is an accent-tinted bar with its signs. Guides,
# distances and notes muted.
