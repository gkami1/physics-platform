# thermo.heat 5.1: three ways of heat transfer. Conduction: heat (accent) runs up a spoon
# from the tea. Convection: warm air (accent) rises from a radiator, cool air (muted) sinks
# and returns. Radiation: rays from the Sun (accent) cross empty space. Qualitative.
