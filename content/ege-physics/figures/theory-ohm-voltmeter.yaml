# electro.circuits.ohm 5.2: a battery and a lamp; one voltmeter is joined to the two ends
# of the lamp, another to the two poles of the source — both in parallel (node dots where
# their wires join the circuit).
# Colours (extends «Конденсаторы»; the first circuits topic, so it fixes the circuit convention):
# circuit symbols (battery, resistor, lamp, ammeter, voltmeter, switch, rheostat) and wires in
# the text colour, node dots text-colour dots (r 3); the conventional current I an accent arrow
# beside the wire (from «+» to «−» outside the source), its label I accent; moving electrons
# accent dots with green arrows for their drift, against the current; E in a wire an accent
# vector; a wire seen up close a conductor (surface fill, text outline) with «+» ions. Labels
# R, U of elements in the text colour beside the symbol; voltages as muted brackets with the
# label in the text colour. Graphs (I(U)) use the diagram kind with the Axes helper, lines
# accent. What stays the same (one current in series, one voltage in parallel) is accent text.
# Guides, distances and notes muted.
