# Local: docker compose -f infra/compose.yaml up --build   → http://localhost:8080
# Prod:  same file + infra/.env with SITE_ADDRESS=<domain>, ACME_EMAIL=..., HTTP_PORT=80, HTTPS_PORT=443
name: physics-platform

services:
  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    environment:
      API_ENV: ${API_ENV:-prod}
      API_LOG_LEVEL: ${API_LOG_LEVEL:-INFO}
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
