# electro.field.capacitors 4.6: why the formulas. Left, two capacitors in parallel: their
# «+» plates are joined and so are their «−» plates, one capacitor with the areas added.
# Right, two in series: the two middle plates, joined by a wire, are one conductor whose
# charges −q and +q are induced, so every plate carries the same charge and the gaps add up.
# Colours (extends «Проводники и диэлектрики в электрическом поле»): plates are text-colour
# bars with their «+» and «−»; field lines text colour, thin, with small arrowheads; E at a
# point an accent vector (never red); a dielectric an accent tint; electrons small dots, moving
# ones accent, their motion a green arrow. Circuit symbols (battery, capacitor, switch) and
# wires in the text colour. Graphs (q(U), U(q)) use the diagram kind with the Axes helper: the
# line accent, the energy under it an accent tint. What stays fixed (q or U) is accent text.
# Guides, distances and notes muted.
