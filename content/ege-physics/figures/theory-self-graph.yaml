# electro.induction.self 11.3: the current I(t) (top) and the EMF of self-induction ℰ_si(t)
# (bottom), qualitative. The current grows, stays, then falls twice as fast; ℰ_si = −L ΔI/Δt
# is against the current while it grows (below the axis), zero while it stays and along it,
# twice as large, while it falls. Muted dashed guides join the moments where the slope changes.
# Colours (the «Электродинамика» convention with the magnetism extension of 8.x–10.x):
