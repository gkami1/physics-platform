# thermo.internal-energy 6.2: two ways to change the internal energy. Left: a force (red)
# pushes the piston down from where it was (dashed muted) and the compressed gas warms.
# Right: a closed vessel over a flame (muted), heat Q flows in (accent). In both the
# molecules' velocities (green) grow. Seed 62, qualitative.
