# electro.optics.refraction 14.5: the same ray (60° from the normal) from air into water,
# glass and diamond (surface fills). The larger the refractive index, the closer the refracted
# ray to the normal (γ ≈ 41°, 35° and 21°; the angles are not written on the figure).
# Colours (the «Электродинамика» convention, extended here for optics): a light ray is an accent
# line with an arrowhead in its middle; the incident and refracted rays solid, a weak partial
# reflection a thinner accent dashed ray, a full reflection (a mirror, total internal reflection)
# solid. The normal to a surface a muted dashed line; angles text-colour arcs, always from the
# normal (α incidence, β reflection, γ refraction). A denser medium (water, glass) a surface
# fill with a text-colour boundary, air none; a mirror a text-colour line hatched on its back.
# Objects and the eye in the text colour; an image (virtual) and the continuations of rays
# behind a mirror or a surface muted dashed. A shadow two layers of a muted tint, a penumbra
# one. Wavefronts thin accent lines across the rays. Guides and notes muted.
