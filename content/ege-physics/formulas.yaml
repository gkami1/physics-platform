    - {grade: 11, title: 'Красная граница фотоэффекта (длина волны)', ask: 'λ_кр = h c/A_вых'}
    - {grade: 11, title: 'Кинетическая энергия фотоэлектронов через запирающее напряжение', ask: 'E_к = e U_з'}
  quantum.atom:
