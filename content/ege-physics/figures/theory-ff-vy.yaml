# mech.kinematics.free-fall 3.3: thrown up at 20 м/с, vy = 20 − 10t; +20 м up, −20 м back down
kind: graph
x: {var: t, unit: с, min: 0, max: 5, step: 1}
y: {var: v_y, unit: м/с, min: -30, max: 30, step: 5, label_every: 2}
series:
  - points: [[0, 20], [2, 0]]
    fill: true
  - points: [[2, 0], [4, -20]]
    fill: true
    tone: vel
notes:
  - {at: [0.6, 4], text: "+20 м", anchor: middle}
  - {at: [3.4, -4], text: "−20 м", anchor: middle}
