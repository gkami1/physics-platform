# electro.optics.wave 16.1: the visible spectrum as a strip of seven equal surface cells with the
# colours' initials, red (about 760 нм) on the left and violet (about 380 нм) on the right;
# arrows below: the wavelength falls and the frequency grows from red to violet.
# Colours (the optics convention of 14.x–15.x): a light ray is an accent line with an arrowhead
# in its middle; the normal muted dashed; angles as arcs; a denser medium (glass, a film) a surface
# fill with a text-colour boundary; a lens a text-colour line with open arrowheads, the principal
# axis muted dash-dot; wavefronts thin accent lines; opaque screens and walls in the text colour.
# Coloured light (decided here): the site palette has no spectrum colours and figures follow the
# theme, so a colour is named, never painted. A ray of one colour is an accent ray labelled with
# its colour; where red and violet share a figure, red (the long wave) is solid and violet dashed.
# White light is a thicker accent ray labelled «белый». A spectrum is a strip of surface cells with
# text-colour borders, each holding its colour's initial (к о ж з г с ф), red on the long-wave side;
# a spectrum of a grating order is an accent-tinted band with «ф» and «к» at its ends.
# An intensity pattern (brightness along a screen) is a graph with an accent curve beside the
# screen; lengths (d, Δ, r) in the text colour, guides and notes muted.
