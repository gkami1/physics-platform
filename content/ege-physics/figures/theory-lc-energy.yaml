# electro.oscillations.lc 12.6: over one period the charge q(t) (top, accent) goes through one
# full cycle, while the capacitor's energy W_C ∝ q² (bottom, accent, drawn with a moving dot)
# and the coil's energy W_L (green) go through two: their period is T/2. Their sum (muted
# dashed) stays. Built like theory-osc-energy (mechanics 13.7).
# Colours (the «Электродинамика» convention, extended here for the LC circuit): circuit
# symbols and wires in the text colour, the plates' «+» and «−» in the text colour as in 4.x;
# the current an accent arrow beside a wire. The electric side is accent and the magnetic
# side green, as potential and kinetic energy in mechanics 13.7: the capacitor's energy W_C
# (bars, curves, the tint between its plates) and its charge q(t) accent; the coil's energy
# W_L (bars, curves, the tint around its turns) and the current I(t) on graphs green. Graphs
# use the diagram kind with the Axes helper; a sum or a comparison muted dashed, guides muted.
