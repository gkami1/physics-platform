[project]
name = "content-schema"
version = "0.1.0"
description = "Content models, validation, build and answer checking for the physics platform"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.10",
    "pyyaml>=6.0",
]

[project.scripts]
content-build = "content_schema.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/content_schema"]
