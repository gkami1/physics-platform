# electro.induction.self 11.5: Φ(I) while the current in a coil grows: a straight line through
# the origin (accent, drawn with a moving dot). For each small step ΔI of the current the
# source does the work Φ′·ΔI against the EMF of self-induction (a strip, accent outline); all
# the strips make the triangle under the line (accent tint), whose area ΦI/2 is the energy W.
# Built like theory-cap-energy (U(q) of 4.4).
# Colours (the «Электродинамика» convention with the magnetism extension of 8.x–10.x):
# circuit symbols and wires in the text colour, an iron core a text-colour line along the
# coil; a lit lamp an accent-tint halo behind its symbol (fading in when it lights late);
# the coil's own field B an accent arrow, the induced field B_инд an accent dashed arrow;
# the current I an accent arrow or accent arrowheads on the turns, the EMF of self-induction
# ℰ_si an accent dashed arrow beside it (along or against the current). Graphs use the
# diagram kind with the Axes helper: curves accent, a curve to compare with muted dashed,
# the energy under a line an accent tint. Guides and notes muted.
