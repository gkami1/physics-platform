# thermo.internal-energy 6.5 (the ladder's figure, redrawn): gas under a loaded piston at
# constant pressure pushes the piston up by Δh (it was at the dashed muted line) with the
# force F = pS (red). On the p–V graph the expansion 1 → 2 (accent, drawn with a moving
# point) and the work A = pΔV as the area under it (accent tint). Qualitative.
# Colours (whole topic, extending «Изопроцессы» and «Количество теплоты»): molecules in the
# text colour with green velocities (their energy is the internal energy; a body's own velocity
# green too); forces on a piston red; heat Q flowing in accent; flames muted; notes muted.
# p–V graphs: the process being discussed accent with a moving point; the work of the gas is the
# area under it: positive work an accent tint, negative work accent hatching (the same
# quantity, the other sign), so on a cycle tint and hatching cancel below the lower path and
# the loop alone stays tinted; other parts of a cycle in the text colour; isotherms that only
# mark a temperature dashed muted; guides dashed muted.
