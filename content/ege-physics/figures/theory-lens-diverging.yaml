# electro.optics.lenses 15.7: the image in a diverging lens. Ray 1 parallel to the axis leaves
# as if from the front focus F (its continuation muted dashed); ray 2 through O goes straight;
# ray 3 aimed at the back focus leaves parallel to the axis. The continuations meet between F
# and the lens: a virtual image (muted dashed arrow), upright and smaller. Computed from the
# lens equation with F < 0.
# Colours (the optics convention of 14.x): a light ray is an accent line with an arrowhead in
# its middle; the continuation of a ray (a virtual image, a virtual focus) muted dashed; the
# normal to a surface muted dashed; a denser medium (glass) a surface fill with a text-colour
# boundary. Lenses (added here): a thin lens is a text-colour line across the principal axis,
# with open arrowheads at its ends pointing outward for a converging lens and inward for a
# diverging one; a lens drawn as a glass body is a surface fill with a text-colour outline.
# The principal axis a muted dash-dot line, a secondary axis and the focal plane muted dashed;
# the optical centre O, the foci F and the points 2F text-colour dots with italic labels.
# An object a text-colour arrow from the axis; a real image a solid text-colour arrow, a virtual
# one a muted dashed arrow; the eye in the text colour. Distances (d, f, F) muted dimension
# lines; similar triangles a surface or an accent tint. Notes muted.
