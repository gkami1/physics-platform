# Local: docker compose -f infra/compose.yaml up --build   → http://localhost:8080
# Prod:  copy infra/.env.example to infra/.env and set real values (domain, strong password).
name: physics-platform

services:
  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
      # Seller details printed on the legal pages and in the footer (static, set at build).
      args:
        PUBLIC_SELLER_NAME: ${SELLER_NAME:-}
        PUBLIC_SELLER_INN: ${SELLER_INN:-}
        PUBLIC_CONTACT_EMAIL: ${CONTACT_EMAIL:-}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    environment:
      API_ENV: ${API_ENV:-prod}
      API_LOG_LEVEL: ${API_LOG_LEVEL:-INFO}
      API_DATABASE_URL: postgresql+asyncpg://physics:${POSTGRES_PASSWORD:-physics}@db:5432/physics
      # Login-code email. Unset host: codes are printed in `docker compose logs api`.
      API_SMTP_HOST: ${SMTP_HOST:-}
      API_SMTP_PORT: ${SMTP_PORT:-465}
      API_SMTP_USER: ${SMTP_USER:-}
      API_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      API_MAIL_FROM: ${MAIL_FROM:-}
      # Tutor models. None set in prod: the tutor answers 503.
      API_LLM_BASE_URL: ${LLM_BASE_URL:-}
      API_LLM_API_KEY: ${LLM_API_KEY:-}
      API_LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen3-8B}
      API_LLM_EXTRA_BODY: ${LLM_EXTRA_BODY:-{"chat_template_kwargs":{"enable_thinking":false}}}
      API_LLM_FALLBACK_BASE_URL: ${LLM_FALLBACK_BASE_URL:-}
      API_LLM_FALLBACK_API_KEY: ${LLM_FALLBACK_API_KEY:-}
      API_LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-deepseek-chat}
      API_LLM_FALLBACK_PRICE_IN: ${LLM_FALLBACK_PRICE_IN:-0}
      API_LLM_FALLBACK_PRICE_OUT: ${LLM_FALLBACK_PRICE_OUT:-0}
      API_TUTOR_DAILY_MESSAGES: ${TUTOR_DAILY_MESSAGES:-20}
      API_TUTOR_PAID_DAILY_MESSAGES: ${TUTOR_PAID_DAILY_MESSAGES:-100}
      API_TUTOR_PAID_MONTHLY_BUDGET_KOP: ${TUTOR_PAID_MONTHLY_BUDGET_KOP:-40000}
      # Payments. Empty login: checkout answers 503 «payments_unavailable».
      API_ROBOKASSA_LOGIN: ${ROBOKASSA_LOGIN:-}
      API_ROBOKASSA_PASSWORD1: ${ROBOKASSA_PASSWORD1:-}
      API_ROBOKASSA_PASSWORD2: ${ROBOKASSA_PASSWORD2:-}
      API_ROBOKASSA_TEST: ${ROBOKASSA_TEST:-true}
      API_ROBOKASSA_HASH: ${ROBOKASSA_HASH:-md5}
      API_PRICE_MONTH_KOP: ${PRICE_MONTH_KOP:-69000}
      API_PRICE_SEASON_KOP: ${PRICE_SEASON_KOP:-299000}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: physics
      POSTGRES_DB: physics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-physics}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U physics -d physics"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # Not published to the host; reach it with `docker compose exec db psql -U physics`.

volumes:
  caddy_data:
  caddy_config:
  pgdata:
