# quantum.photoeffect 2.2: the current-voltage curve of a photocell, computed from the model of
# <pp-photoeffect>: I = Iн·F0(1 + U/Uз)² for −Uз ≤ U ≤ 0 (only the electrons heading for the anode
# with eU < E arrive) and I = Iн(1 − (1 − F0)exp(−U/U1)) for U > 0, with F0 = 0,5 and
# U1 = (1 − F0)Uз/(2F0), no kink at U = 0. Units: Uз = 1 (52 px), Iн = 1 (120 px). The current
# vanishes at −Uз and levels off at the saturation current Iн.
# Colours (the general convention): objects (metal, tube, electrodes, electrons) in the text
# colour with a surface fill; light as accent photon packets, as in theory-phot-*; electron
# velocities in the vel tone; graphs in the text colour with accent curves (a second curve dashed);
# guides and notes muted. A colour of light is named, never painted.
