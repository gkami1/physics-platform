# thermo.first-law 7.7: a rectangular cycle run clockwise on p–V (accent, a moving point,
# direction arrows). The sign of the heat on each side from Q = ΔU + A: heated at constant
# volume (1 → 2) and expanding while heated (2 → 3) the gas gets heat; cooled at constant
# volume (3 → 4) and compressed while cooled (4 → 1) it gives heat away. Qualitative.
# Colours (whole topic, extending «Внутренняя энергия и работа газа»): heat Q accent, flowing in
# or out (an arrow into or out of the gas); the change of internal energy ΔU green (as the
# molecules' velocities and the model's ΔU bar); the work of the gas A an accent tint with an
# accent outline in bars, as the area under p(V) (hatched when negative); Q split into ΔU and A
# as a branching arrow or bars; flames muted; forces red; a piston's motion in the text colour;
# an adiabat's insulation a thick muted layer. p–V graphs: the process being discussed accent
# with a moving point and small accent arrows for the direction; isotherms that only mark a
# temperature dashed muted; guides dashed muted; notes muted.
