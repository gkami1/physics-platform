[project]
name = "physics-platform"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = ["content-schema", "api"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/content_schema", "api"]

[tool.uv.sources]
content-schema = { workspace = true }
api = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["packages/content_schema/tests", "api/tests"]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Cyrillic text is intentional

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["packages/content_schema/src", "api/src"]
plugins = ["pydantic.mypy"]
