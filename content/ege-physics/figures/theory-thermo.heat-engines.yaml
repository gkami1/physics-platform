# thermo.heat-engines 8.1 (the ladder's figure, redrawn: it drew the heater and Q₁ red like a
# force and the work green like ΔU): the heater gives the working body the heat Q₁ (solid
# accent block arrow), the body does the work A (accent tint) and gives |Q₂| to the cooler
# (accent outline). Arrow widths add up: 36 = 10 + 26 px. Qualitative.
# Colours (whole topic, extending «Первый закон термодинамики»): the heat received from the
# heater Q₁ solid accent; the heat given to the cooler |Q₂| an accent outline (a real flow of
# the cycle, not lost by accident as the muted heat in 5.3, but not the useful part either);
# the work A an accent tint with an accent outline, as the area inside a cycle on p–V and the
# model's bar; energy flows as block arrows whose widths add up (Q₁ = A + |Q₂|); heater and
# cooler (room and chamber for a refrigerator) surface blocks with a text-colour outline; what
# cannot happen crossed out muted; flames muted; forces red (none here). p–V graphs: the cycle
# or the part being discussed accent with a moving point and small accent arrows for the
# direction, the rest of a cycle in the text colour; isotherms and adiabats that only mark a
# shape or a temperature dashed muted; guides dashed muted; notes muted.
