name: tutor-evals

# Real model calls cost money: run only when the tutor's behaviour can change, or by hand.
# Prompts carry content and scripted dialogue only, no user data.
on:
  pull_request:
    paths:
      - api/src/platform_api/prompt.py
      - api/src/platform_api/llm.py
      - api/src/platform_api/leak.py
      - api/src/platform_api/hints.py
      - api/src/platform_api/turn.py
      - evals/**
      - .github/workflows/evals.yml
  workflow_dispatch:
    inputs:
      provider:
        description: "primary | fallback (empty: as configured, with fallback)"
        required: false
        default: ""
      repeats:
        description: "runs per conversation"
        required: false
        default: "1"

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_LLM_BASE_URL: ${{ secrets.EVAL_LLM_BASE_URL }}
      API_LLM_API_KEY: ${{ secrets.EVAL_LLM_API_KEY }}
      API_LLM_MODEL: ${{ vars.EVAL_LLM_MODEL || 'Qwen/Qwen3-8B' }}
      API_LLM_FALLBACK_BASE_URL: ${{ secrets.EVAL_LLM_FALLBACK_BASE_URL }}
      API_LLM_FALLBACK_API_KEY: ${{ secrets.EVAL_LLM_FALLBACK_API_KEY }}
      API_LLM_FALLBACK_MODEL: ${{ vars.EVAL_LLM_FALLBACK_MODEL || 'deepseek-chat' }}
      API_LLM_FALLBACK_PRICE_IN: ${{ vars.EVAL_LLM_FALLBACK_PRICE_IN || '0' }}
      API_LLM_FALLBACK_PRICE_OUT: ${{ vars.EVAL_LLM_FALLBACK_PRICE_OUT || '0' }}
      API_ENV: prod # no scripted model: fail loudly if nothing is configured
    steps:
      - name: Model configured?
        id: cfg
        run: |
          if [ -z "$API_LLM_BASE_URL$API_LLM_FALLBACK_BASE_URL" ]; then
            echo "::notice::No EVAL_LLM_* secrets set; tutor evals skipped."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.skip != 'true'
      - uses: astral-sh/setup-uv@v6
        if: steps.cfg.outputs.skip != 'true'
        with:
          version: "0.11.7"
          enable-cache: true
      - name: Run evals
        if: steps.cfg.outputs.skip != 'true'
        run: |
          uv sync --frozen
          uv run content-build build
          args=(--repeats "${{ inputs.repeats || '1' }}" --out evals/results/report.json --markdown summary.md)
          if [ -n "${{ inputs.provider }}" ]; then args+=(--provider "${{ inputs.provider }}"); fi
          set +e
          uv run tutor-eval run "${args[@]}"
          status=$?
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/upload-artifact@v4
        if: always() && steps.cfg.outputs.skip != 'true'
        with:
          name: tutor-evals-${{ github.sha }}
          path: evals/results/report.json
          retention-days: 90
