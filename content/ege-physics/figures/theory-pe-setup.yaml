# quantum.photoeffect 2.1: Stoletov's setup. A glass vacuum tube with two electrodes: the cathode
# (right, joined to the minus of the source) is lit through the glass (accent photon packets);
# the photoelectrons (vel arrows) fly to the anode (left, plus) and close the circuit through the
# ammeter. Battery: long plate = +.
# Colours (the general convention): objects (metal, tube, electrodes, electrons) in the text
# colour with a surface fill; light as accent photon packets, as in theory-phot-*; electron
# velocities in the vel tone; graphs in the text colour with accent curves (a second curve dashed);
# guides and notes muted. A colour of light is named, never painted.
