# thermo.gas-laws 3.1: the same gas under a piston three times. Twice the load — the
# gas squeezed into half the volume, the molecules denser, the pressure on the wall
# (red) twice as long; heated under the same load — the volume grows, the molecules are
# faster (longer green arrow), the pressure stays. Seed 31, qualitative.
# Colours (whole topic, extending «Основы МКТ» and «Идеальный газ»): molecules in the text
# colour, the focal quantity accent, velocity green, forces (pressure on a wall) red, notes
# muted. Graphs of processes: the process being discussed accent (drawn with a moving
# point where it runs from 1 to 2), its extension to the origin dashed muted, other
# isotherms or isochores muted, the other two isoprocesses through the same state in the
# text colour.
