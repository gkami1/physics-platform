roke="none">пути равны, а на медленном участке тело проводит больше времени</text><g class="fig-accent" color="royalblue"><text x="200" y="180" text-anchor="middle" font-size="14" fill="currentColor" stroke="none">v<tspan dy="4.2" font-size="10.1">ср</tspan><tspan dy="-4.2">​</tspan> = 120 км : 4 ч = 30 км/ч, а не 40</text></g></svg>
