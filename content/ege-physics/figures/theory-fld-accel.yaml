# electro.field.strength 2.8: a charge set free between plates speeds up along the force (red):
# a proton (+, top) towards −, to the lower potential; an electron (dot, bottom) towards +,
# to the higher. Strobe at equal times: x ∝ t², velocities (green) 14, 28, 42 px ∝ t; earlier
# positions muted, the last accent.
# Colours (extends «Электрический заряд и закон Кулона»): a charge is a circle in the text
# colour (surface fill) with «+» or «−»; the charge being discussed (a test charge, the moving
# particle) accent. Forces red. Field lines are the field's picture: text colour, thin, with
# small arrowheads along them; the field strength E at a point is a vector, accent (thicker for
# a resultant), so E is never red: red is a force. A point where the field is measured is a
# small accent dot. Plates are bars in the text colour with their «+» and «−» signs;
# equipotential lines dashed muted; velocities green; guides, distances and notes muted.
