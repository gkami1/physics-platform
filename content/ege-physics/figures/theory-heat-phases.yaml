# thermo.heat 5.4: the same water molecules as ice (a lattice; bonds muted; a solid, surface
# fill), liquid (close, no order; accent tint) and vapour (far apart, velocities green).
# Melting takes λm and vaporisation Lm (accent arrows right); crystallisation and
# condensation give them back (muted arrows left). Seed 54, qualitative.
# Colours (whole topic, extending «Основы МКТ», «Идеальный газ», «Изопроцессы» and
# «Насыщенный пар»): heat Q flowing in or out is the focal quantity, accent arrows; heat lost
# to the air muted; liquid water an accent tint with an accent surface line; ice and other
# solids the surface fill with a text-colour outline; molecules in the text colour (crystal
# bonds muted), molecule velocities green; heaters and flames muted; notes muted. Graphs: the
# process being discussed accent with a moving point (sloped parts and flat parts alike: the
# notes say which is which), guides dashed muted.
