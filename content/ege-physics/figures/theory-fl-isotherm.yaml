# thermo.first-law 7.5: at constant temperature ΔU = 0 and Q = A. Expansion along the
# isotherm (accent, a moving point, a direction arrow): the work, an accent tint under the
# hyperbola, is positive and the gas gets as much heat. Compression: the work is negative
# (accent hatching) and the gas gives the heat away. Qualitative.
# Colours (whole topic, extending «Внутренняя энергия и работа газа»): heat Q accent, flowing in
# or out (an arrow into or out of the gas); the change of internal energy ΔU green (as the
