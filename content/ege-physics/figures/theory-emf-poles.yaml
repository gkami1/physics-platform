# electro.circuits.emf 6.3: the circuit of 6.2 with a voltmeter on the source's poles,
# joined just outside the dashed outline: it shows U = IR, the voltage on the outer circuit
# (muted bracket over R), which is ℰ minus the drop Ir inside the source.
# Colours (the circuit convention of «Ток, сопротивление и закон Ома для участка цепи», extended
# for a real source): circuit symbols and wires in the text colour, node dots text-colour dots
# (r 3); the conventional current I an accent arrow beside the wire, its label accent; labels R,
# U, r and ℰ in the text colour beside the symbol, a battery's «+» and «−» small text-colour
# signs; a real source is its battery ℰ and its internal resistance r inside a muted dashed
# outline; voltages over a stretch as muted brackets with a text-colour label. Inside the source
# the field E is an accent vector and the outside force F_ст red (a force), as is the field's
# force on the charge. A source's U(I) graph uses the diagram kind with the Axes helper: the
# line accent, its ends on the axes text-colour dots labelled ℰ and I_кз, a slope triangle in
# muted guides. The split ℰ = U + Ir as a stacked bar: U an accent tint, Ir a muted tint.
# What stays the same (ℰ) is accent text. Guides and notes muted.
