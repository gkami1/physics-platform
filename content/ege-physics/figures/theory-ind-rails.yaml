# electro.induction.faraday 10.7: a rod on rails, seen from above, in a field away from us
# (accent crosses). The rails are joined by a resistor R on the left; the rod slides to the
# right (green v), the circuit's area (muted tint) grows. The induced current I (accent)
# goes up in the rod (q v × B with Bz = −1 points up), left along the top rail, down the
# resistor and right along the bottom rail — counter-clockwise, so its field inside is
# towards us, against the growing flux. The Ampère force on the rod (red) points left, against v.
# Colours (the «Электродинамика» convention with the magnetism extension of 8.x and 9.x):
# magnetic field lines in the text colour, thin, with small arrowheads; the vector B an accent
# arrow, the induced field B_инд an accent dashed arrow; a field across the page a sparse grid
# of accent «×» (away from us) or «·» (towards us). A magnet's N half an accent tint, its S half
# a muted tint. Wires, coils, rings, rails and frames in the text colour; a frame's normal n a
# text-colour arrow; the induced current an accent arrow beside the wire or an accent arrowhead
# on a ring. A moving magnet's or rod's velocity green; the Lorentz and Ampère forces red; a
# charged particle a surface circle with its sign; the area that the flux goes through a muted
# tint; galvanometer needles in the text colour; guides and notes muted.
