# quantum.atom 3.3: three spectra on one wavelength scale 760…380 нм (red on the left, the visible
# band as lettered surface cells). Continuous; the emission spectrum of hydrogen (bright lines on an
# empty strip); the absorption spectrum (dark lines on the continuous strip). Lines from
# E_n = −13,6/n² эВ, λ = hc/(E_n − E_2), hc = 1239,84 эВ·нм: 656.4, 486.2, 434.1, 410.2 нм.
