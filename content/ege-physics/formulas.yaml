# Formulas for «Блиц» (/ege-physics/blitz/). The player sees the title and the left side of
# `ask` and types the right side; any algebraically equal answer counts (checked by evaluating
# both at random values), so write each formula once, in its textbook form.
#
# `ask` syntax (web/src/lib/blitz/expr.ts):
#   - one letter per variable; a subscript follows `_`: v_0, F_тр, E_{к2} (braces for a
#     subscript that ends in a digit after letters); Δ joins the next letter: Δt, ΔΦ
#   - letters next to each other multiply: m g h; `*` or `·` also work
#   - `/` divides everything to its left in the same product by everything to its right in
#     the same product: m v^2/2 is (m v²)/2; use parentheses for a sum below the line
#   - functions with parentheses: sin(α), cos(α), tg(α), sqrt(l/g); powers: sin(α)^2
#   - π is the number; every other letter (g, G, k, c, h, e, N_A…) is a variable
# `also` lists other right sides that count as correct (e.g. a different rounding).
# Topics are roadmap ids; grade is the school grade where the formula first appears.
topics:
  mech.kinematics.basics:
    - {grade: 7, title: 'Скорость равномерного движения', ask: 'v = s/t'}
    - {grade: 7, title: 'Путь при равномерном движении', ask: 's = v t'}
    - {grade: 7, title: 'Средняя скорость на двух участках пути', ask: 'v_ср = (s_1 + s_2)/(t_1 + t_2)'}
    - {grade: 9, title: 'Координата при равномерном движении', ask: 'x = x_0 + v t'}
  mech.kinematics.uniform-accel:
    - {grade: 9, title: 'Ускорение', ask: 'a = (v - v_0)/t'}
    - {grade: 9, title: 'Скорость при равноускоренном движении', ask: 'v = v_0 + a t'}
    - {grade: 9, title: 'Перемещение при равноускоренном движении', ask: 's = v_0 t + a t^2/2'}
    - {grade: 9, title: 'Координата при равноускоренном движении', ask: 'x = x_0 + v_0 t + a t^2/2'}
    - {grade: 9, title: 'Перемещение без времени движения', ask: 's = (v^2 - v_0^2)/(2 a)'}
    - {grade: 9, title: 'Перемещение через начальную и конечную скорости', ask: 's = (v_0 + v) t/2'}
  mech.kinematics.free-fall:
    - {grade: 9, title: 'Скорость тела, падающего без начальной скорости', ask: 'v = g t'}
    - {grade: 9, title: 'Высота падения без начальной скорости за время t', ask: 'h = g t^2/2'}
    - {grade: 9, title: 'Скорость тела в конце падения с высоты h', ask: 'v = sqrt(2 g h)'}
    - {grade: 10, title: 'Максимальная высота подъёма тела, брошенного вверх', ask: 'h_max = v_0^2/(2 g)'}
    - {grade: 10, title: 'Время подъёма тела, брошенного вверх', ask: 't_п = v_0/g'}
    - {grade: 10, title: 'Горизонтальная проекция скорости тела, брошенного под углом α', ask: 'v_x = v_0 cos(α)'}
    - {grade: 10, title: 'Время полёта тела, брошенного под углом α к горизонту', ask: 't = 2 v_0 sin(α)/g'}
    - {grade: 10, title: 'Дальность полёта тела, брошенного под углом α к горизонту', ask: 'L = v_0^2 sin(2 α)/g'}
    - {grade: 10, title: 'Максимальная высота тела, брошенного под углом α к горизонту', ask: 'h_max = v_0^2 sin(α)^2/(2 g)'}
    - {grade: 10, title: 'Дальность полёта тела, брошенного горизонтально с высоты h', ask: 'L = v_0 sqrt(2 h/g)'}
