# thermo.humidity 4.6: an isotherm of water vapour. Compressed at constant temperature,
# unsaturated vapour follows pV = const (1 → 2); at V_нас it is saturated, and further
# compression condenses vapour at constant p_н (2 → 3, flat). The whole isotherm dashed
# accent, the ideal-gas hyperbola it would follow dashed muted. Qualitative axes.
# Colours (whole topic, extending «Основы МКТ», «Идеальный газ» and «Изопроцессы»):
# molecules in the text colour, the tracked molecule and the focal quantity accent,
# velocity green (a molecule leaving or returning to the liquid), pressure on a surface red,
# notes muted; liquid water an accent tint with an accent surface line. Graphs: the curve of
# saturated-vapour pressure p_н(t) is a property of water, drawn in the text colour; the
# state or process being discussed accent (a moving point from 1 to 2); guides and the
# ideal-gas continuation of an isotherm dashed muted. When p_н(t) itself is the focus
# (graph kind, 4.2) it is accent.
