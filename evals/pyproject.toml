[project]
name = "tutor-evals"
version = "0.1.0"
description = "Eval harness for the AI tutor"
requires-python = ">=3.13"
dependencies = [
    "api",
    "content-schema",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.scripts]
tutor-eval = "tutor_evals.cli:main"

[tool.uv.sources]
api = { workspace = true }
content-schema = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tutor_evals"]
