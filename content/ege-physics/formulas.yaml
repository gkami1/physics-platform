    - {grade: 11, title: 'Амплитуда силы тока в контуре', ask: 'I_max = q_max ω'}
    - {grade: 11, title: 'Сохранение энергии в колебательном контуре', ask: 'L I_max^2/2 = C U_max^2/2'}
  electro.oscillations.waves:
    - {grade: 11, title: 'Действующее значение напряжения', ask: 'U_д = U_max/sqrt(2)'}
    - {grade: 11, title: 'Действующее значение силы тока', ask: 'I_д = I_max/sqrt(2)'}
    - {grade: 11, title: 'Трансформатор', ask: 'U_1/U_2 = N_1/N_2'}
    - {grade: 11, title: 'Длина электромагнитной волны', ask: 'λ = c/ν'}
    - {grade: 11, title: 'Длина электромагнитной волны через период', ask: 'λ = c T'}
  electro.optics.refraction:
    - {grade: 11, title: 'Закон преломления света', ask: 'n_1 sin(α) = n_2 sin(γ)'}
    - {grade: 11, title: 'Абсолютный показатель преломления', ask: 'n = c/v'}
    - {grade: 11, title: 'Относительный показатель преломления', ask: 'n_21 = n_2/n_1'}
    - {grade: 11, title: 'Предельный угол полного отражения', ask: 'sin(α_пр) = 1/n'}
  electro.optics.lenses:
    - {grade: 8, title: 'Оптическая сила линзы', ask: 'D = 1/F'}
    - {grade: 11, title: 'Формула тонкой линзы', ask: '1/F = 1/d + 1/f'}
    - {grade: 11, title: 'Фокусное расстояние из формулы тонкой линзы', ask: 'F = d f/(d + f)'}
    - {grade: 11, title: 'Увеличение линзы', ask: 'Γ = f/d'}
  electro.optics.wave:
    - {grade: 11, title: 'Условие интерференционного максимума', ask: 'Δd = k λ'}
    - {grade: 11, title: 'Условие интерференционного минимума', ask: 'Δd = (2 k + 1) λ/2'}
    - {grade: 11, title: 'Главные максимумы дифракционной решётки', ask: 'd sin(φ) = k λ'}
  sr.basics:
    - {grade: 11, title: 'Энергия покоя', ask: 'E_0 = m c^2'}
    - {grade: 11, title: 'Полная энергия релятивистской частицы', ask: 'E = m c^2/sqrt(1 - v^2/c^2)'}
    - {grade: 11, title: 'Релятивистское замедление времени', ask: 't = t_0/sqrt(1 - v^2/c^2)'}
    - {grade: 11, title: 'Релятивистское сокращение длины', ask: 'l = l_0 sqrt(1 - v^2/c^2)'}
