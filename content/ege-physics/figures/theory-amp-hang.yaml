# electro.magnetic.ampere 8.7: a horizontal rod seen end-on (current away from us), forces red.
# Left: a horizontal field to the left holds it up, F_А = mg. Right: on threads in a vertical
# field the rod swings out by α; T, mg and the horizontal F_А balance, tan α = F_А/(mg).
# T is drawn shorter than to scale so that it stays clear of the thread.
# Colours (the «Электродинамика» convention, extended for magnetism): magnetic field lines
# in the text colour, thin, with small arrowheads, always closed or leaving the picture —
# as the electric field lines of 2.4 and 4.2; the vector B an accent arrow, as E was; a field
# across the page a sparse grid of accent «×» (away from us) or «·» (towards us). A wire seen
# end-on is a text-colour circle (r ≥ 10, surface fill) with a dot (current towards us) or a
# cross (away from us); along the page the current is an accent arrow beside the wire, as in
# circuits. A magnet's N half is an accent tint and its S half a muted tint, letters N and S
# in the text colour; a compass needle's N half solid accent, its S half solid muted. The
# Ampère force and other forces red; guides and notes muted.
