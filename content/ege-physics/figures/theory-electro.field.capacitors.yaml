# electro.field.capacitors 4.2: a parallel-plate capacitor: plates +q and −q (text-colour bars
# with signs) a distance d apart; inside a uniform field (parallel text-colour lines), E at a
# point an accent vector; outside the field is almost zero. Redrawn from the ladder's figure,
# whose plates were red and accent and whose field lines were muted.
