# electro.field.capacitors 4.3: four capacitors side by side (plates as text-colour bars):
# as it was (C₀), plates twice the area (2C₀), the plates twice as close (2C₀), a dielectric
# between them, an accent tint (εC₀). The capacitance under each in accent.
# Colours (extends «Проводники и диэлектрики в электрическом поле»): plates are text-colour
