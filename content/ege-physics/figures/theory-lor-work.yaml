# electro.magnetic.lorentz 9.3: positions of a positive particle at equal time steps (text-colour
# dots). Left: an electric field along the motion (text-colour lines, E accent); the force is
# along v and the steps grow (x ∝ t²). Right: a field towards us (accent dots); the Lorentz
# force points to the centre, perpendicular to v, the steps are equal: the speed stays.
# Colours (the «Электродинамика» convention with the magnetism extension of 8.x): magnetic
# field lines in the text colour, thin, with small arrowheads; the vector B an accent arrow;
# a field across the page a sparse grid of accent «×» (away from us) or «·» (towards us).
# Extended for 9.x: a charged particle is a surface circle (r 11) with «+» or «−» in the text
# colour, as the charges of 1.x and 2.x; its velocity green (and its parts muted dashed), the
# Lorentz force and other forces red; its trajectory a text-colour line, animated ones drawn
# with a text-colour mover dot; the radius and other guides muted dashed; notes muted; the
# dees of a cyclotron a muted tint, its gap plain; the accelerating plates text colour.
