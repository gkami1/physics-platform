name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      API_TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run content-build validate
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --frozen
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: No private content in the built site
        run: |
          uv run python - <<'EOF'
          import json, pathlib, sys
          priv = json.loads(pathlib.Path("build/private/ege-physics.json").read_text("utf-8"))
          site = "".join(p.read_text("utf-8", errors="ignore") for p in pathlib.Path("web/dist").rglob("*") if p.is_file())
          leaks = [t["id"] for t in priv["tasks"] if t["solution"].strip() and t["solution"].strip() in site]
          if leaks:
              sys.exit(f"solutions leaked into web/dist: {leaks}")
          EOF

  docker:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Caddyfile (local and production site addresses)
        run: |
          for addr in ":80" "example.ru"; do
            docker run --rm -e SITE_ADDRESS="$addr" -v "$PWD/infra/Caddyfile:/etc/caddy/Caddyfile:ro" \
              caddy:2.10-alpine caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile
          done
      - run: docker compose -f infra/compose.yaml build
      - name: Start the stack (scripted tutor, no SMTP)
        run: docker compose -p pp-check -f infra/compose.yaml up -d --wait
        env:
          API_ENV: dev
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
          enable-cache: true
      - name: Smoke test through Caddy
        run: |
          uv sync --frozen
          uv run python infra/smoke.py http://localhost:8080 pp-check
      - name: Stack logs on failure
        if: failure()
        run: docker compose -p pp-check -f infra/compose.yaml logs --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose -p pp-check -f infra/compose.yaml down -v
