# Run from the repo root: uv run alembic -c api/alembic.ini upgrade head
# The database URL comes from API_DATABASE_URL (see platform_api.settings).
[alembic]
script_location = %(here)s/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
