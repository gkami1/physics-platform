# electro.field.coulomb 1.2: rubbing a balloon on hair. Each body has six nuclei («+»)
# and, before, six electrons (dots): charge 0. Two electrons (accent) move from the hair
# to the balloon: the hair is left with +2e, the balloon gets −2e. The nuclei stay.
# Colours (whole topic; the first of «Электродинамика», so this sets the section's convention):
# a charge is a circle in the text colour (surface fill) with «+» or «−» inside; the charge
# being discussed (a test charge, a result) accent. Never + red and − blue: red is the force
# colour and accent means focus. Electrons are small dots in the text colour, the ones that
# moved accent, their way an accent arrow. Coulomb forces red (they are forces), equal and
# opposite arrows of visibly equal length; a resultant red and thicker; guides and the
# distance r muted; notes muted.
