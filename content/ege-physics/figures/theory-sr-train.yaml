# sr.basics 1.1: a ball tossed straight up in a car moving uniformly. Left, in the car: it flies
# up and falls back into the hand. Right, from the platform: the car (dashed where it was, solid
# where it is) moves 92 px while the ball flies, so the ball draws a parabola x = x₀ + v t,
# y = y₀ + v_y t − g t²/2 (computed, top in the middle). The law is the same, the paths differ.
