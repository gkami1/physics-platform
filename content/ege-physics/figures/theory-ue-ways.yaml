# p–V graphs: the process being discussed accent with a moving point; the work of the gas is the
# area under it: positive work an accent tint, negative work accent hatching (the same
# quantity, the other sign), so on a cycle tint and hatching cancel below the lower path and
# the loop alone stays tinted; other parts of a cycle in the text colour; isotherms that only
# mark a temperature dashed muted; guides dashed muted.
