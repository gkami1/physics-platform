# quantum.nuclear-reactions 6.6: a pressurised-water reactor (like the ВВЭР), schematic. In the vessel:
# fuel rods (solid), control rods (muted) from above, water as moderator and coolant. The first loop
# carries hot water to the steam generator and back through a pump; the second loop's steam turns
# the turbine and the generator, the condensed water returns.
