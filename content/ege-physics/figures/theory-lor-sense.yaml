# electro.magnetic.lorentz 9.4: two particles of equal mass and opposite charge fly in along one
# line into a field away from us (accent crosses right of the muted dashed boundary). The
# positive one turns up (counter-clockwise), the negative one down (clockwise): q v × B with
# Bz = −1. After half a turn both leave the field flying back; drawn with movers.
